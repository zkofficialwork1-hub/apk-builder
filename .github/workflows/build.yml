name: Build APK
run-name: build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID
        required: true
        type: string
      config:
        description: Base64 encoded build configuration
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Android project
        env:
          CFG: ${{ inputs.config }}
          ID: ${{ inputs.build_id }}
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          j() {
            echo "$CFG" | base64 -d | jq -r "$1"
          }

          NAME=$(j '.name')
          PKG=$(j '.pkg')
          VER=$(j '.ver')
          CODE=$(j '.code')
          URL=$(j '.url')
          THEME=$(j '.theme')
          STATUS=$(j '.status')
          NAV=$(j '.nav')
          UA=$(j '.ua')
          OFFLINE=$(j '.offline')

          JS=$(j '.js')
          PTR=$(j '.ptr')
          FILES=$(j '.files')
          CAM=$(j '.cam')
          LOC=$(j '.loc')
          NOTIF=$(j '.notif')
          DEBUG=$(j '.debug')

          case "$(j '.orient')" in
            portrait) OR="portrait" ;;
            landscape) OR="landscape" ;;
            *) OR="unspecified" ;;
          esac

          case "$(j '.cache')" in
            network) CM="WebSettings.LOAD_NO_CACHE" ;;
            cache) CM="WebSettings.LOAD_CACHE_ELSE_NETWORK" ;;
            *) CM="WebSettings.LOAD_DEFAULT" ;;
          esac

          [ "$(j '.ext')" = "app" ] && EXTAPP=true || EXTAPP=false
          [ "$(j '.back')" = "exit" ] && BACKEXIT=true || BACKEXIT=false
          [ "$(j '.full')" = "true" ] && FULL="getWindow().getDecorView().setSystemUiVisibility(5894);" || FULL=""

          [ -z "$OFFLINE" ] && OFFLINE="You are offline"

          R="app/src/main/res"
          mkdir -p \
            app/src/main/java/com/w2a/app \
            app/src/main/assets \
            "$R/drawable" \
            "$R/values" \
            "$R/mipmap-xxhdpi"

          echo "$CFG" | base64 -d > app/src/main/assets/config.json

          ICON=""
          if [ -f "icons/$ID.png" ]; then
            cp "icons/$ID.png" "$R/mipmap-xxhdpi/ic_launcher.png"
            ICON='android:icon="@mipmap/ic_launcher"'
          fi

          PERMS=""
          if [ "$CAM" = "true" ]; then
            PERMS="$PERMS<uses-permission android:name=\"android.permission.CAMERA\"/>"
          fi

          if [ "$LOC" = "true" ]; then
            PERMS="$PERMS<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>"
          fi

          if [ "$NOTIF" = "true" ]; then
            PERMS="$PERMS<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>"
          fi

          SIGN=""
          REL=""

          if [ "$(j '.release')" = "true" ]; then
            if [ -z "$KSPASS" ]; then
              echo "::error::KEYSTORE_PASSWORD secret is missing."
              exit 1
            fi

            if [ ! -f keystore.enc ]; then
              echo "::error::keystore.enc is missing from the repository."
              exit 1
            fi

            openssl enc \
              -d \
              -aes-256-cbc \
              -pbkdf2 \
              -iter 200000 \
              -pass env:KSPASS \
              -in keystore.enc \
              -out release.jks

            SIGN='
              signingConfigs {
                release {
                  storeFile file("../release.jks")
                  storePassword System.getenv("KSPASS")
                  keyAlias "upload"
                  keyPassword System.getenv("KSPASS")
                }
              }
            '

            REL="signingConfig signingConfigs.release"
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = "Web2APK"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id "com.android.application" version "8.11.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > "$R/values/themes.xml" <<EOF
          <resources>
            <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
              <item name="colorPrimary">$THEME</item>
              <item name="colorSecondary">$THEME</item>
              <item name="colorOnPrimary">#FFFFFF</item>
            </style>
          </resources>
          EOF

          cat > app/build.gradle <<EOF
          plugins {
            id "com.android.application"
          }

          android {
            namespace "com.w2a.app"
            compileSdk 36

            defaultConfig {
              applicationId "$PKG"
              minSdk 24
              targetSdk 36
              versionCode $CODE
              versionName "$VER"
            }

            lint {
              checkReleaseBuilds false
              abortOnError false
            }

            $SIGN

            buildTypes {
              release {
                $REL
                minifyEnabled false
              }
            }
          }

          dependencies {
            implementation "androidx.appcompat:appcompat:1.7.1"
            implementation "com.google.android.material:material:1.12.0"
            implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET"/>
            $PERMS

            <application
              android:label="$NAME"
              $ICON
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="false">

              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="$OR"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>

            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/w2a/app/MainActivity.java <<'EOF'
          package com.w2a.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.net.Uri;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.content.Intent;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends Activity {

              private WebView webView;
              private SwipeRefreshLayout refresh;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  String url = "URL_PLACEHOLDER";
                  String offline = "OFFLINE_PLACEHOLDER";

                  webView = new WebView(this);
                  refresh = new SwipeRefreshLayout(this);
                  refresh.addView(webView);
                  setContentView(refresh);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(JS_PLACEHOLDER);
                  settings.setDomStorageEnabled(true);
                  settings.setCacheMode(CACHE_PLACEHOLDER);
                  settings.setAllowFileAccess(FILES_PLACEHOLDER);
                  settings.setGeolocationEnabled(LOC_PLACEHOLDER);

                  String ua = "UA_PLACEHOLDER";
                  if (!ua.isEmpty()) {
                      settings.setUserAgentString(ua);
                  }

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();

                          if (!uri.getScheme().equals("http") &&
                              !uri.getScheme().equals("https")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {}
                              return true;
                          }

                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          refresh.setRefreshing(false);
                      }

                      @Override
                      public void onReceivedError(
                              WebView view,
                              WebResourceRequest request,
                              WebResourceError error) {

                          if (request.isForMainFrame()) {
                              refresh.setRefreshing(false);
                              view.loadData(
                                  "<html><meta name='viewport' content='width=device-width'>" +
                                  "<body style='font-family:sans-serif;text-align:center;padding:40px'>" +
                                  "<h2>" + offline + "</h2>" +
                                  "<p>Pull down to try again.</p></body></html>",
                                  "text/html",
                                  "UTF-8"
                              );
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, LOC_PLACEHOLDER, false);
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (CAM_PLACEHOLDER) {
                                  request.grant(request.getResources());
                              } else {
                                  request.deny();
                              }
                          });
                      }
                  });

                  refresh.setEnabled(PTR_PLACEHOLDER);
                  refresh.setOnRefreshListener(() -> webView.reload());

                  webView.loadUrl(url);
              }
          }
          EOF

          sed -i \
            -e "s|URL_PLACEHOLDER|$URL|g" \
            -e "s|OFFLINE_PLACEHOLDER|$OFFLINE|g" \
            -e "s|JS_PLACEHOLDER|$JS|g" \
            -e "s|CACHE_PLACEHOLDER|$CM|g" \
            -e "s|FILES_PLACEHOLDER|$FILES|g" \
            -e "s|LOC_PLACEHOLDER|$LOC|g" \
            -e "s|UA_PLACEHOLDER|$UA|g" \
            -e "s|PTR_PLACEHOLDER|$PTR|g" \
            -e "s|CAM_PLACEHOLDER|$CAM|g" \
            app/src/main/java/com/w2a/app/MainActivity.java

      - name: Compile
        env:
          CFG: ${{ inputs.config }}
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          RELEASE=$(echo "$CFG" | base64 -d | jq -r '.release')

          if [ "$RELEASE" = "true" ]; then
            echo "Building signed release APK + AAB..."
            gradle bundleRelease assembleRelease --no-daemon --stacktrace
          else
            echo "Building debug APK..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Publish APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.build_id }}
          CFG: ${{ inputs.config }}
        shell: bash
        run: |
          set -e

          RELEASE=$(echo "$CFG" | base64 -d | jq -r '.release')

          rm -f "$ID.apk" "$ID.aab"

          if [ "$RELEASE" = "true" ]; then

            test -f app/build/outputs/apk/release/app-release.apk
            test -f app/build/outputs/bundle/release/app-release.aab

            cp app/build/outputs/apk/release/app-release.apk "$ID.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$ID.aab"

            gh release create "$ID" \
              "$ID.apk" \
              "$ID.aab" \
              --title "$ID" \
              --notes "Web2APK signed Play Store build"

          else

            test -f app/build/outputs/apk/debug/app-debug.apk

            cp app/build/outputs/apk/debug/app-debug.apk "$ID.apk"

            gh release create "$ID" \
              "$ID.apk" \
              --title "$ID" \
              --notes "Web2APK debug build"

          fi

      - name: Remove build icon
        if: always()
        env:
          ID: ${{ inputs.build_id }}
        shell: bash
        run: |
          if [ -f "icons/$ID.png" ]; then
            git rm -f "icons/$ID.png" || true
            git config user.name "web2apk-bot"
            git config user.email "web2apk-bot@users.noreply.github.com"
            git commit -m "cleanup build icon $ID" || true
            git push || true
          fi
